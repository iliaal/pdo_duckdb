name: Binary build validation

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: binary-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and exercise every Unix archive
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux.yml
    with:
      package-version: validation-${{ github.sha }}
      artifact-prefix: validation-unix
