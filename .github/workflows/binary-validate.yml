name: Binary build validation

# Runs on pull requests that can change the release archives, and by manual
# dispatch for the pre-tag dry run. Pushes to master do not run it.
on:
  pull_request:
    branches: [master]
    paths:
      - config.m4
      - config.w32
      - .github/**
      - scripts/**
      - .upstream/**
      - 'pdo_duckdb_bridge*'
      - 'duckdb_static_extensions.*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: binary-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and exercise every Unix archive
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux.yml
    with:
      package-version: validation-${{ github.sha }}
      artifact-prefix: validation-unix
