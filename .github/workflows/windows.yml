name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build and validate Windows archives
    permissions:
      contents: read
    uses: ./.github/workflows/binary-validate-windows.yml
    with:
      include-source-floor: true

  legacy-source:
    name: DuckDB 1.5.3 and PHP 8.1 source compatibility
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yml
    with:
      duckdb-version: '1.5.3'
      source-compatibility-only: true
      package-version: validation-${{ github.sha }}
      artifact-prefix: validation-windows-legacy
