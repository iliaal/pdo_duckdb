name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build and validate Windows archives
    permissions:
      contents: read
    uses: ./.github/workflows/binary-validate-windows.yml
    with:
      # Push and PR builds one PHP version per MSVC toolset (8.3 vs16, 8.5 vs17,
      # 8.6 vs18); a manual dispatch builds all 12 lanes for the pre-tag dry run.
      include-source-floor: ${{ github.event_name == 'workflow_dispatch' }}
      php-versions: ${{ github.event_name != 'workflow_dispatch' && '8.3 8.5 8.6' || '' }}

  legacy-source:
    name: DuckDB 1.5.3 and PHP 8.1 source compatibility
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yml
    with:
      duckdb-version: '1.5.3'
      source-compatibility-only: true
      package-version: validation-${{ github.sha }}
      artifact-prefix: validation-windows-legacy
