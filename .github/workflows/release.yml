name: Release binaries

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  unix:
    name: Build Linux and macOS archives
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux.yml

  windows:
    name: Build Windows archives
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yml

  publish:
    name: Publish complete archive set
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Downloads artifacts from this workflow run.
      contents: write # Uploads the validated archives to the release.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and publish the complete validated archive set
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            printf 'unsupported release tag for an archive name\n'
            exit 1
          fi

          gh run download "$GITHUB_RUN_ID" --pattern 'release-*' --dir release-assets
          python3 scripts/binary-matrix.py verify-archives --directory release-assets --version "$RELEASE_TAG"
          readarray -d '' archives < <(
            find release-assets -type f -name '*.zip' -print0
          )
          if [ "${#archives[@]}" -ne 50 ]; then
            printf 'expected 50 validated release archives, found %d\n' "${#archives[@]}"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${archives[@]}" --clobber
