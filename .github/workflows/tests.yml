name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .upstream/duckdb.yml.
  DUCKDB_VERSION: '2.0.0'

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ASan argument forwarding regression tests
        run: bash config-tests/asan_arguments.sh
      - name: macOS minimum-version probe regression tests
        run: bash config-tests/macos_minimum_probe.sh
      - name: Release libduckdb link-check regression tests
        run: bash config-tests/release_libduckdb_link.sh
      - name: Common-suite harness regression tests
        run: bash config-tests/pdo_common_status.sh
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Common-suite path preservation regression tests
        run: bash config-tests/pdo_common_paths.sh
      - run: composer validate --strict
      - name: PIE configure-option metadata regression test
        run: php config-tests/configure_options.php
      - name: Exact-source cache integrity regressions
        run: python3 scripts/test-duckdb-bridge-source.py

  bridge-sources:
    name: Prepare DuckDB ${{ matrix.duckdb }} source headers
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        duckdb: ['1.5.3', '1.5.6', '2.0.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ matrix.duckdb }}

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: bridge-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin unzip
      - name: Install libduckdb to /usr/local
        run: |
          asset=duckdb-shared-libs-linux-amd64.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          mkdir -p /tmp/duckdb
          tar -xzf "$asset" -C /tmp/duckdb
          sudo install -m644 /tmp/duckdb/*.h /usr/local/include/
          sudo install -m755 /tmp/duckdb/libduckdb.so /usr/local/lib/
          sudo ldconfig
      - name: Download PIE
        run: |
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build complete source package through PIE
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pdo-duckdb-dist"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pdo-duckdb-dist"
          cd "$RUNNER_TEMP/pdo-duckdb-dist"
          for file in scripts/duckdb-bridge-source.py scripts/check-duckdb-headers.py scripts/build-windows-duckdb.ps1 scripts/windows-duckdb-source/CMakeLists.txt; do
            test -r "$file"
          done
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/pdo_duckdb:*@dev --with-pdo-duckdb-bridge-source="$GITHUB_WORKSPACE/duckdb-bridge"

  linux:
    name: PHP ${{ matrix.php }} - Linux / DuckDB ${{ matrix.duckdb }}
    needs: bridge-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        duckdb: ['2.0.0']
        include:
          - php: '8.4'
            duckdb: '1.5.6'
    env:
      DUCKDB_VERSION: ${{ matrix.duckdb }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Cache libduckdb
        id: cache-duckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb
          key: duckdb-shared-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('.github/duckdb-sha256.txt') }}-headers-v2

      - name: Download libduckdb
        if: steps.cache-duckdb.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends unzip
          case "$DUCKDB_VERSION" in
            1.5.*) asset=libduckdb-linux-amd64.zip ;;
            *) asset=duckdb-shared-libs-linux-amd64.tar.gz ;;
          esac
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          mkdir -p duckdb/include duckdb/lib raw
          case "$asset" in
            *.zip) unzip -o "$asset" -d raw ;;
            *.tar.gz) tar -xzf "$asset" -C raw ;;
          esac
          cp raw/*.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/


      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Cache the matching real static bundle for prefix probes
        if: matrix.php == '8.4'
        id: static-probe-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb-static-probe.archive
          key: duckdb-static-config-probe-${{ env.DUCKDB_VERSION }}-${{ hashFiles('.github/duckdb-sha256.txt') }}
      - name: Verify and extract the static probe bundle
        if: matrix.php == '8.4'
        env:
          STATIC_CACHE_HIT: ${{ steps.static-probe-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          case "$DUCKDB_VERSION" in
            1.5.*) asset=static-libs-linux-amd64.zip ;;
            *) asset=duckdb-static-libs-linux-amd64.tar.gz ;;
          esac
          if [ "$STATIC_CACHE_HIT" != true ]; then
            curl -fsSL --retry 5 -o duckdb-static-probe.archive \
              "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/$asset"
          fi
          checksum=$(awk -v asset="$asset" '$2 == asset { print $1 }' .github/duckdb-sha256.txt)
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  duckdb-static-probe.archive\n' "$checksum" | sha256sum --check --strict -
          mkdir duckdb-static-probe
          case "$asset" in
            *.zip) unzip -q duckdb-static-probe.archive -d duckdb-static-probe ;;
            *) tar -xzf duckdb-static-probe.archive -C duckdb-static-probe ;;
          esac
      - name: Configure prefix regression probe (symlink and in-tree TMPDIR)
        if: matrix.php == '8.4'
        env:
          DUCKDB_PREFIX: ${{ github.workspace }}/duckdb
          DUCKDB_STATIC_PREFIX: ${{ github.workspace }}/duckdb-static-probe
          BRIDGE_SOURCE: ${{ github.workspace }}/duckdb-bridge
        run: |
          link="$RUNNER_TEMP/pdo-duckdb-wt"
          ln -s "$PWD" "$link"
          mkdir -p "$PWD/build/probe-tmp"
          sha256sum duckdb/lib/libduckdb.so run-tests.php > "$RUNNER_TEMP/probe-input.sha256"
          TMPDIR="$PWD/build/probe-tmp" "$link/config-tests/prefix_spaces.sh"
          sha256sum --check "$RUNNER_TEMP/probe-input.sha256"
      - name: DuckDB 2.0 header detection regression probe
        if: matrix.php == '8.4' && matrix.duckdb == '1.5.6'
        env:
          DUCKDB_PREFIX: ${{ github.workspace }}/duckdb
          BRIDGE_SOURCE: ${{ github.workspace }}/duckdb-bridge
        run: sh config-tests/duckdb_v2_detection.sh
      - name: Restore a different release for the bridge identity negative control
        if: matrix.php == '8.4' && matrix.duckdb == '2.0.0'
        uses: ./.github/actions/duckdb-bridge
        with:
          version: '1.5.3'
          path: duckdb-bridge-mismatch
      - name: Reject mismatched and modified C++ source caches
        if: matrix.php == '8.4' && matrix.duckdb == '2.0.0'
        env:
          DUCKDB_PREFIX: ${{ github.workspace }}/duckdb
          BRIDGE_SOURCE: ${{ github.workspace }}/duckdb-bridge
          MISMATCH_BRIDGE_SOURCE: ${{ github.workspace }}/duckdb-bridge-mismatch
        run: sh config-tests/bridge_identity.sh
      - name: Build extension
        shell: bash
        run: |
          phpize
          ./configure --with-pdo-duckdb="$PWD/duckdb" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev
          grep -qx '#define HAVE_PDO_DUCKDB_BRIDGE 1' config.h
          if [[ "$DUCKDB_VERSION" == 2.* ]]; then
            grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          else
            grep -qx '/\* #undef HAVE_DUCKDB_V2 \*/' config.h
          fi
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'warning:' "$RUNNER_TEMP/build.log"; then
            echo "::error::Build produced warnings"
            exit 1
          fi

      - name: Verify engine version and build generation
        env:
          PDO_DUCKDB_EXPECT_VERSION: ${{ matrix.duckdb }}
          PDO_DUCKDB_EXPECT_V2: ${{ matrix.duckdb == '2.0.0' && '1' || '0' }}
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          php -d "extension=$PWD/modules/pdo_duckdb.so" scripts/binary-probe.php

      - name: Preserve PHP 8.4 module for real storage interoperability
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ matrix.duckdb }}
          path: |
            modules/pdo_duckdb.so
            duckdb/lib/libduckdb.so
          if-no-files-found: error

      - name: Cache DuckDB test extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb-test-extensions
          key: duckdb-test-extensions-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('scripts/install-test-extensions.php') }}

      - name: Install DuckDB test extensions
        # Tests 117-119 SKIP when these can't be installed; installing here makes
        # a failed download fail the job, and the run below rejects any SKIP.
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          php -d "extension=$PWD/modules/pdo_duckdb.so" \
            scripts/install-test-extensions.php "$PWD/duckdb-test-extensions"

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          TEST_PHP_EXECUTABLE="$(command -v php)"
          export TEST_PHP_EXECUTABLE
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          export PDO_DUCKDB_TEST_EXTENSION_DIR="$PWD/duckdb-test-extensions"
          # tee keeps the --show-diff output inline; set +e keeps a failing run
          # from aborting before its exit status is read.
          set +e
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          test_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${test_status[0]}" -ne 0 ]; then
            echo "::error::run-tests.php failed (exit ${test_status[0]})"
            exit "${test_status[0]}"
          fi
          if [ "${test_status[1]}" -ne 0 ]; then
            echo "::error::Test output could not be recorded (exit ${test_status[1]})"
            exit "${test_status[1]}"
          fi
          bash scripts/check-required-tests.sh "$RUNNER_TEMP/test-output.txt" \
            tests/117_sandbox_loaded_quack_lazy.phpt \
            tests/118_sandbox_loaded_quack_persistent.phpt \
            tests/119_sandbox_uncontained_extension.phpt \
            tests/136_sandbox_quack_listener_nul_uri.phpt
          if [[ "$DUCKDB_VERSION" == 2.* ]]; then
            bash scripts/check-required-tests.sh "$RUNNER_TEMP/test-output.txt" \
              tests/131_sandbox_extension_repositories.phpt \
              tests/132_persistent_connect_discard.phpt \
              tests/133_sandbox_connect_quack_v2.phpt \
              tests/134_sandbox_file_writers_v2.phpt \
              tests/137_sandbox_attach_nul_path.phpt \
              tests/166_remote_prepared_values.phpt \
              tests/167_remote_prepared_streaming.phpt \
              tests/207_legacy_parser_parameters.phpt
          fi

      - name: PDO common tests
        # Only on 8.4/8.5, where the suite runs clean apart from the 2
        # allowlisted DuckDB SQL-dialect fails. On 8.1-8.3 the older
        # ext/pdo/tests files have poor isolation (generic table names, no
        # --CLEAN--, unmarked XFAIL) and fail against a shared DSN for reasons
        # unrelated to the driver.
        if: matrix.php == '8.4' || matrix.php == '8.5'
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          # Run PHP's shared ext/pdo/tests against the driver (generic PDO
          # contract: fetch modes, bound params, transactions, error modes).
          # The suite isn't bundled; sparse-checkout it at the installed
          # release tag, since branch-head tests can depend on unreleased
          # ext/pdo fixes. Dev/RC builds fall back to the branch.
          full="$(php -r 'echo PHP_VERSION;')"
          case "$full" in
            *[!0-9.]*) ref="PHP-${PHP_VERSION}" ;;
            *) ref="php-${full}" ;;
          esac
          git clone --depth=1 --branch="$ref" --filter=blob:none --sparse \
            https://github.com/php/php-src.git /tmp/php-src-common
          git -C /tmp/php-src-common sparse-checkout set ext/pdo/tests
          PHP="$(which php)" \
          RUN_TESTS="$PWD/run-tests.php" \
          COMMON_DIR=/tmp/php-src-common/ext/pdo/tests \
          DUCKDB_PREFIX="$PWD/duckdb" \
          EXT="$PWD/modules/pdo_duckdb.so" \
          bash scripts/pdo-common-tests.sh

  macos-shared:
    name: PHP 8.4 - macOS shared library
    needs: bridge-sources
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 20
        env:
          # The released watchdog mistakes partial-line output for inactivity.
          SETUP_PHP_BREW_WATCHDOG: 'false'
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Download libduckdb
        run: |
          asset=duckdb-shared-libs-osx-universal.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | shasum -a 256 --check --strict
          mkdir -p "$RUNNER_TEMP/Duck DB/include" "$RUNNER_TEMP/Duck DB/lib" raw
          tar -xzf "$asset" -C raw
          cp raw/*.h "$RUNNER_TEMP/Duck DB/include/"
          cp raw/libduckdb.dylib "$RUNNER_TEMP/Duck DB/lib/"
      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build and rebuild after clean
        run: |
          phpize
          ./configure --with-pdo-duckdb="$RUNNER_TEMP/Duck DB" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev
          grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make clean
          make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: Run tests
        run: |
          TEST_PHP_EXECUTABLE="$(command -v php)"
          export TEST_PHP_EXECUTABLE
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          PDO_DUCKDB_EXPECT_VERSION="$DUCKDB_VERSION" PDO_DUCKDB_EXPECT_V2=1 \
            php -d "extension=$PWD/modules/pdo_duckdb.so" scripts/binary-probe.php
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  static-build:
    name: Static release build
    uses: ./.github/workflows/binary-validate.yml

  linux-php-branch:
    needs: bridge-sources
    # setup-php's '8.6' is a php-src master snapshot, not the PHP-8.6 branch,
    # so the 8.6 lane builds PHP itself (release mode, PDO static in the CLI).
    name: PHP ${{ matrix.php }} - Linux (PHP-${{ matrix.php }} branch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.6']

    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y re2c bison autoconf unzip

      - name: Cache libduckdb
        id: cache-duckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb
          key: duckdb-shared-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('.github/duckdb-sha256.txt') }}-headers-v2

      - name: Download libduckdb
        if: steps.cache-duckdb.outputs.cache-hit != 'true'
        run: |
          case "$DUCKDB_VERSION" in
            1.5.*) asset=libduckdb-linux-amd64.zip ;;
            *) asset=duckdb-shared-libs-linux-amd64.tar.gz ;;
          esac
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          mkdir -p duckdb/include duckdb/lib raw
          case "$asset" in
            *.zip) unzip -o "$asset" -d raw ;;
            *.tar.gz) tar -xzf "$asset" -C raw ;;
          esac
          cp raw/*.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/

      - name: Build PHP from the PHP-${{ matrix.php }} branch
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          ./configure \
            --disable-zts \
            --disable-all \
            --enable-cli \
            --enable-pdo \
            --prefix=/tmp/php-branch
          make -j"$(nproc)"
          make install
          echo "/tmp/php-branch/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build extension
        shell: bash
        run: |
          phpize
          ./configure --with-pdo-duckdb="$PWD/duckdb" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev \
            --with-php-config=/tmp/php-branch/bin/php-config
          grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'warning:' "$RUNNER_TEMP/build.log"; then
            echo "::error::Build produced warnings"
            exit 1
          fi

      - name: Cache DuckDB test extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb-test-extensions
          key: duckdb-test-extensions-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('scripts/install-test-extensions.php') }}

      - name: Install DuckDB test extensions
        # Tests 117-119 SKIP when these can't be installed; installing here makes
        # a failed download fail the job, and the run below rejects any SKIP.
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          /tmp/php-branch/bin/php -d "extension=$PWD/modules/pdo_duckdb.so" \
            scripts/install-test-extensions.php "$PWD/duckdb-test-extensions"

      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          export TEST_PHP_EXECUTABLE=/tmp/php-branch/bin/php
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          export PDO_DUCKDB_TEST_EXTENSION_DIR="$PWD/duckdb-test-extensions"
          set +e
          /tmp/php-branch/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          test_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${test_status[0]}" -ne 0 ]; then
            echo "::error::run-tests.php failed (exit ${test_status[0]})"
            exit "${test_status[0]}"
          fi
          if [ "${test_status[1]}" -ne 0 ]; then
            echo "::error::Test output could not be recorded (exit ${test_status[1]})"
            exit "${test_status[1]}"
          fi
          bash scripts/check-required-tests.sh "$RUNNER_TEMP/test-output.txt" \
            tests/117_sandbox_loaded_quack_lazy.phpt \
            tests/118_sandbox_loaded_quack_persistent.phpt \
            tests/119_sandbox_uncontained_extension.phpt \
            tests/136_sandbox_quack_listener_nul_uri.phpt \
            tests/166_remote_prepared_values.phpt \
            tests/167_remote_prepared_streaming.phpt \
            tests/207_legacy_parser_parameters.phpt

      - name: PDO common tests
        run: |
          full="$(php -r 'echo PHP_VERSION;')"
          case "$full" in
            *[!0-9.]*) ref="PHP-${PHP_VERSION}" ;;
            *) ref="php-${full}" ;;
          esac
          git clone --depth=1 --branch="$ref" --filter=blob:none --sparse \
            https://github.com/php/php-src.git /tmp/php-src-common
          # PHP 8.6's pdo_test.inc requires the top-level tests/probe_cache.inc.
          git -C /tmp/php-src-common sparse-checkout set --no-cone \
            /ext/pdo/tests/ /tests/probe_cache.inc
          PHP=/tmp/php-branch/bin/php \
          RUN_TESTS="$PWD/run-tests.php" \
          COMMON_DIR=/tmp/php-src-common/ext/pdo/tests \
          DUCKDB_PREFIX="$PWD/duckdb" \
          EXT="$PWD/modules/pdo_duckdb.so" \
          bash scripts/pdo-common-tests.sh

  duckdb-floor:
    name: DuckDB 1.5.3 floor - PHP 8.4
    needs: bridge-sources
    runs-on: ubuntu-latest
    env:
      DUCKDB_FLOOR_VERSION: '1.5.3'
      DUCKDB_FLOOR_SHA256: '0a926eba5bce0abc0010f4b9109133e4440cb74e97bd10fd2d0fc2a721621b05'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none

      - name: Download DuckDB floor release
        run: |
          curl -fsSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_FLOOR_VERSION}/libduckdb-linux-amd64.zip"
          echo "${DUCKDB_FLOOR_SHA256}  /tmp/libduckdb.zip" | sha256sum --check --strict
          mkdir -p duckdb/include duckdb/lib raw
          unzip -o /tmp/libduckdb.zip -d raw
          cp raw/duckdb.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/

      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_FLOOR_VERSION }}
      - name: Build against DuckDB floor
        run: |
          phpize
          ./configure --with-pdo-duckdb="$PWD/duckdb" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev
          make -j"$(nproc)"

      - name: Preserve minimum-engine module for real storage interoperability
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-1.5.3
          path: |
            modules/pdo_duckdb.so
            duckdb/lib/libduckdb.so
          if-no-files-found: error

      - name: Run full suite against DuckDB floor
        # No extension pre-install or required-tests gate here: the sandbox
        # extension tests (117-119) may SKIP in this lane.
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          TEST_PHP_EXECUTABLE="$(command -v php)"
          export TEST_PHP_EXECUTABLE
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  storage-interop:
    name: Reopen databases across DuckDB 1.5.3, 1.5.6, and 2.0
    needs: [linux, duckdb-floor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Download the three engine builds from this workflow run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: Download the exact modules built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for version in 1.5.3 1.5.6 2.0.0; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "interop-$version" --dir "storage-modules/$version"
          done
      - name: Build isolated runtime commands
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          runners = {}
          for version in ('1.5.3', '1.5.6', '2.0.0'):
              root = pathlib.Path('storage-modules', version).resolve()
              module = root / 'modules/pdo_duckdb.so'
              library = root / 'duckdb/lib/libduckdb.so'
              if not module.is_file() or not library.is_file():
                  raise SystemExit(f'Missing runtime artifact for {version}')
              runners[version] = {
                  'command': [shutil.which('php'), '-n', '-d', f'extension={module}'],
                  'env': {'LD_LIBRARY_PATH': str(library.parent)},
              }
          pathlib.Path('storage-runners.json').write_text(json.dumps(runners))
          PY
      - name: Reopen older files after GA writes and GA compatibility files with old engines
        run: php scripts/storage-interop.php storage-runners.json

  duckdb-ga-hook:
    name: DuckDB 2.0 GA undecodable-type hook - PHP 8.4
    needs: bridge-sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none

      - name: Cache DuckDB 2.0 GA
        id: cache-duckdb-ga
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb
          key: duckdb-shared-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('.github/duckdb-sha256.txt') }}-headers-v2

      - name: Download DuckDB 2.0 GA
        if: steps.cache-duckdb-ga.outputs.cache-hit != 'true'
        run: |
          asset=duckdb-shared-libs-linux-amd64.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          mkdir -p duckdb/include duckdb/lib raw
          tar -xzf "$asset" -C raw
          cp raw/*.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/

      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build with the undecodable-type test hook
        # Test 147 needs a module that treats DATE as a type it cannot decode.
        shell: bash
        run: |
          phpize
          CFLAGS="-g -O2 -DPDO_DUCKDB_TEST_UNDECODABLE_TYPE=13" \
            ./configure --with-pdo-duckdb="$PWD/duckdb" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev
          grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/build-hook.log"
          if grep -q 'warning:' "$RUNNER_TEMP/build-hook.log"; then
            echo "::error::Build produced warnings"
            exit 1
          fi

      - name: Run the undecodable-type test against the hooked build
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          TEST_PHP_EXECUTABLE="$(command -v php)"
          export TEST_PHP_EXECUTABLE
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          set +e
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK,SKIP \
            tests/147_v2_undecodable_type_rejected.phpt 2>&1 | tee "$RUNNER_TEMP/test-hook-output.txt"
          test_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${test_status[0]}" -ne 0 ]; then
            echo "::error::run-tests.php failed (exit ${test_status[0]})"
            exit "${test_status[0]}"
          fi
          if [ "${test_status[1]}" -ne 0 ]; then
            echo "::error::Test output could not be recorded (exit ${test_status[1]})"
            exit "${test_status[1]}"
          fi
          bash scripts/check-required-tests.sh "$RUNNER_TEMP/test-hook-output.txt" \
            tests/147_v2_undecodable_type_rejected.phpt

  portable-integers:
    name: Portable integer renderers - PHP 8.4
    needs: bridge-sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none

      - name: Download libduckdb
        run: |
          asset=duckdb-shared-libs-linux-amd64.tar.gz
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          mkdir -p duckdb/include duckdb/lib raw
          tar -xzf "$asset" -C raw
          cp raw/*.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/

      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build without compiler int128 support
        run: |
          phpize
          CFLAGS="-U__SIZEOF_INT128__" \
            ./configure --with-pdo-duckdb="$PWD/duckdb" --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" --enable-pdo-duckdb-dev
          grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          make -j"$(nproc)"

      - name: Run full suite through portable integer renderers
        # No extension pre-install or required-tests gate here: the sandbox
        # extension tests (117-119) may SKIP in this lane.
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib"
          TEST_PHP_EXECUTABLE="$(command -v php)"
          export TEST_PHP_EXECUTABLE
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  asan:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} - ASAN / DuckDB ${{ matrix.duckdb }}
    needs: bridge-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.6']
        ts: ['nts']
        duckdb: ['2.0.0']
        include:
          - php: '8.4'
            ts: zts
            duckdb: '1.5.3'
          - php: '8.4'
            ts: zts
            duckdb: '2.0.0'

    env:
      ASAN_OPTIONS: exitcode=139:verify_asan_link_order=0:detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      PHP_VERSION: ${{ matrix.php }}
      PHP_THREAD_SAFETY: ${{ matrix.ts }}
      DUCKDB_VERSION: ${{ matrix.duckdb }}
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      USE_TRACKED_ALLOC: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm clang re2c bison autoconf unzip

      - name: Put the clang ASan runtime on the loader path
        # -shared-libasan binaries (the configure C-compiler probe, the built
        # php, the extension) need libclang_rt.asan_*.so at runtime; it lives in
        # clang's resource dir, not a default loader path. Without this, php-src
        # configure fails with "cannot run C compiled programs".
        run: echo "LD_LIBRARY_PATH=$(clang -print-resource-dir)/lib/linux" >> "$GITHUB_ENV"

      - name: Cache libduckdb
        id: cache-duckdb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb
          key: duckdb-shared-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('.github/duckdb-sha256.txt') }}-headers-v2

      - name: Download libduckdb
        if: steps.cache-duckdb.outputs.cache-hit != 'true'
        run: |
          case "$DUCKDB_VERSION" in
            1.5.*) asset=libduckdb-linux-amd64.zip ;;
            *) asset=duckdb-shared-libs-linux-amd64.tar.gz ;;
          esac
          curl -fsSL -o "$asset" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${asset}"
          if [ "$DUCKDB_VERSION" = 1.5.3 ]; then
            echo "0a926eba5bce0abc0010f4b9109133e4440cb74e97bd10fd2d0fc2a721621b05  $asset" | sha256sum --check --strict
          else
            grep "  $asset$" .github/duckdb-sha256.txt | sha256sum --check --strict
          fi
          mkdir -p duckdb/include duckdb/lib raw
          case "$asset" in
            *.zip) unzip -o "$asset" -d raw ;;
            *.tar.gz) tar -xzf "$asset" -C raw ;;
          esac
          cp raw/*.h duckdb/include/
          cp raw/libduckdb.so duckdb/lib/

      - name: Build PHP with ASAN and PDO (-shared-libasan keeps __cxa_throw resolvable across dlopen)
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          thread_option=--disable-zts
          if [ "$PHP_THREAD_SAFETY" = zts ]; then thread_option=--enable-zts; fi
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-debug \
            "$thread_option" \
            --disable-all \
            --enable-cli \
            --enable-pdo \
            --enable-embed \
            --prefix=/tmp/php-asan
          make -j"$(nproc)"
          make install

      - uses: ./.github/actions/duckdb-bridge
        with:
          version: ${{ env.DUCKDB_VERSION }}
      - name: Build extension with ASAN
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --with-pdo-duckdb="$PWD/duckdb" \
            --with-pdo-duckdb-bridge-source="$PWD/duckdb-bridge" \
            --with-php-config=/tmp/php-asan/bin/php-config
          if [ "$DUCKDB_VERSION" = 2.0.0 ]; then
            grep -qx '#define HAVE_DUCKDB_V2 1' config.h
          else
            grep -qx '/\* #undef HAVE_DUCKDB_V2 \*/' config.h
          fi
          make -j"$(nproc)"

      - name: Exercise simultaneous ZTS requests and shared-instance sandbox escalation
        if: matrix.ts == 'zts'
        env:
          PHP_CONFIG: /tmp/php-asan/bin/php-config
          EXT: ${{ github.workspace }}/modules/pdo_duckdb.so
          DUCKDB_PREFIX: ${{ github.workspace }}/duckdb
        run: bash config-tests/zts_instance_threads.sh

      - name: Cache DuckDB test extensions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: duckdb-test-extensions
          key: duckdb-test-extensions-linux-amd64-${{ env.DUCKDB_VERSION }}-${{ hashFiles('scripts/install-test-extensions.php') }}

      - name: Install DuckDB test extensions
        # Tests 117-119 SKIP when these can't be installed; installing here makes
        # a failed download fail the job, and the run below rejects any SKIP.
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib:${LD_LIBRARY_PATH}"
          /tmp/php-asan/bin/php -d "extension=$PWD/modules/pdo_duckdb.so" \
            scripts/install-test-extensions.php "$PWD/duckdb-test-extensions"

      - name: Run tests under ASAN
        run: |
          export LD_LIBRARY_PATH="$PWD/duckdb/lib:${LD_LIBRARY_PATH}"
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$PWD/modules/pdo_duckdb.so"
          export NO_INTERACTION=1
          export PDO_DUCKDB_TEST_EXTENSION_DIR="$PWD/duckdb-test-extensions"
          set +e
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK,SKIP tests/ 2>&1 | tee /tmp/test-output.txt
          test_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${test_status[0]}" -ne 0 ]; then
            echo "::error::run-tests.php failed under ASAN (exit ${test_status[0]})"
            exit "${test_status[0]}"
          fi
          if [ "${test_status[1]}" -ne 0 ]; then
            echo "::error::ASAN test output could not be recorded (exit ${test_status[1]})"
            exit "${test_status[1]}"
          fi
          if grep -qP 'Expected leak\s*:\s*[1-9][0-9]*' /tmp/test-output.txt; then
            echo "::error::ASAN test run contains expected leaks (XLEAK)"
            exit 1
          fi
          bash scripts/check-executed-tests.sh /tmp/test-output.txt
          bash scripts/check-required-tests.sh /tmp/test-output.txt \
            tests/117_sandbox_loaded_quack_lazy.phpt \
            tests/118_sandbox_loaded_quack_persistent.phpt \
            tests/119_sandbox_uncontained_extension.phpt \
            tests/136_sandbox_quack_listener_nul_uri.phpt
          if [ "$DUCKDB_VERSION" = '2.0.0' ]; then
            bash scripts/check-required-tests.sh /tmp/test-output.txt \
              tests/166_remote_prepared_values.phpt \
              tests/167_remote_prepared_streaming.phpt \
              tests/207_legacy_parser_parameters.phpt
          fi
