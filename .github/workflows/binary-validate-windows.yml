name: Binary build validation (Windows)

on:
  workflow_call:
    inputs:
      include-source-floor:
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: binary-validate-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yml
    with:
      package-version: validation-${{ github.sha }}
      artifact-prefix: validation-windows
      include-source-floor: ${{ inputs.include-source-floor || false }}
